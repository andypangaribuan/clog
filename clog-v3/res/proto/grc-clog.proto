syntax = "proto3";

package grc_clog;

// service for push the log from app services using rmod.
service LogService {
  // batch processing of log entries
  rpc PushBatch (LogBatchRequest) returns (LogResponse);
}

message LogBatchRequest {
  repeated LogEntryRequest entries = 1;
}

message LogEntryRequest {
  string uid               = 1;
  int64  timestamp_unix_ms = 2;
  string service_name      = 3;
  string trace_id          = 4;
  string parent_uid        = 5;
  string user_uid          = 6;
  string log_type          = 7;   // 'API_INCOMING', 'DB_QUERY', 'GRPC_OUTGOING', 'GRPC_INCOMING'
  string action_name       = 8;
  int32  duration_ms       = 9;
  int32  status_code       = 10;
  string payload_json      = 11;
}

message LogResponse {
  bool  success        = 1;
  int32 accepted_count = 2;
}
