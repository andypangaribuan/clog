syntax = "proto3";

package grc_clog;

// service for push the log from app services using rmod.
service LogService {
  // batch processing of log entries
  rpc PushBatch (LogBatchRequest) returns (LogResponse);
}

message LogBatchRequest {
  repeated LogEntryRequest entries = 1;
}

message LogEntryRequest {
  string uid               = 1;
  int64  timestamp_unix_ms = 2;
  string env_name          = 3;
  string service_name      = 4;
  string trace_id          = 5;
  string parent_uid        = 6;
  string user_uid          = 7;
  string log_type          = 8;
  string action_name       = 9;
  int32  duration_ms       = 10;
  int32  status_code       = 11;
  string payload_json      = 12;
  string pod_name          = 13;
  string info_json         = 14;
}

message LogResponse {
  bool  success        = 1;
  int32 accepted_count = 2;
}
